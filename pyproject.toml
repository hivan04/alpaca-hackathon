[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oaa"
version = "0.1.0"
description = "Options Alpha Agents - autonomous options trading agents on Alpaca"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "alpaca-py>=0.42",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "tenacity>=8.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
agents = [
    "anthropic>=0.34",
    "mcp>=1.2",
]
app = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]
quant = [
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "scipy>=1.12",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
]
all = ["oaa[agents,app,quant,dev]"]

[project.scripts]
oaa = "oaa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oaa = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
