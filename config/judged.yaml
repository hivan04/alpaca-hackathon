# Overlay applied when OAA_PROFILE=judged.
# This is the account the judges evaluate. Tighter, slower, no experiments.
profile: judged

broker:
  paper: true
  primary: rest
  require_risk_approval: true

execution:
  dry_run: false          # this profile actually trades

risk:
  # Raised from 4 on 27 Aug. Self-imposed, not a hackathon rule. At 4/day the
  # judged 5-6 session window could open at most 20 positions and, measured,
  # expected fewer than two. The daily loss halt below is the real protection
  # for an account judges read in full - a position count is a poor proxy for
  # it, because it caps upside and downside equally.
  max_new_positions_per_day: 12
  max_risk_per_trade_pct: 0.015
  daily_loss_limit_pct: 0.03

telemetry:
  run_dir: "runs/judged"
  journal: "runs/judged/journal.jsonl"
  db: "runs/judged/oaa.sqlite"
  equity_curve: "runs/judged/equity.csv"
