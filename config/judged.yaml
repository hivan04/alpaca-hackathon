# Overlay applied when OAA_PROFILE=judged.
# This is the account the judges evaluate. Tighter, slower, no experiments.
profile: judged

broker:
  paper: true
  primary: rest
  require_risk_approval: true

execution:
  dry_run: false          # this profile actually trades
  # Chase DISABLED on the judged account, 28 Aug. The chase loop cancels a
  # resting order without checking whether the cancel succeeded, then submits
  # the next step under a DIFFERENT client_order_id - so the idempotency guard
  # cannot see the first order. If the original fills in the moment the cancel
  # is issued (a normal race; a filled order cannot be cancelled) the book ends
  # up with 2x the risk-approved quantity and the risk engine counts one entry.
  # A slightly worse fill is a far cheaper problem than a doubled position on
  # the account judges read.
  chase:
    enabled: false

risk:
  # Raised from 4 on 27 Aug. Self-imposed, not a hackathon rule. At 4/day the
  # judged 5-6 session window could open at most 20 positions and, measured,
  # expected fewer than two. The daily loss halt below is the real protection
  # for an account judges read in full - a position count is a poor proxy for
  # it, because it caps upside and downside equally.
  # 20, raised from 12 on 27 Aug. intraday_momentum alone is now allowed 12 a
  # day, so a global cap of 12 would have silently pre-empted the carry book
  # entirely once the day book got going. The daily LOSS limit below is the
  # control that should bind, not a position count.
  max_new_positions_per_day: 20
  # 0.01 from 30 Aug, lowered from 0.015 to MATCH config/dev.yaml. While the
  # two differed, every backtest run on dev described a different strategy
  # from the one the judged account trades: same code and same data gave
  # +$846.61 on dev and -$237.18 on judged for 2026-08-17..21, because 50%
  # larger positions burn the net_delta budget faster and the cap then
  # refuses entries dev accepted (41 trades vs 44). This file's own header
  # says 'tighter, slower' - 1.5% against dev's 1.0% was the opposite.
  max_risk_per_trade_pct: 0.01
  daily_loss_limit_pct: 0.03

telemetry:
  run_dir: "runs/judged"
  journal: "runs/judged/journal.jsonl"
  db: "runs/judged/oaa.sqlite"
  equity_curve: "runs/judged/equity.csv"
