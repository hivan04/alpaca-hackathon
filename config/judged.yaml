# Overlay applied when OAA_PROFILE=judged.
# This is the account the judges evaluate. Tighter, slower, no experiments.
profile: judged

broker:
  paper: true
  primary: rest
  require_risk_approval: true

execution:
  dry_run: false          # this profile actually trades
  # Chase DISABLED on the judged account, 28 Aug. The chase loop cancels a
  # resting order without checking whether the cancel succeeded, then submits
  # the next step under a DIFFERENT client_order_id - so the idempotency guard
  # cannot see the first order. If the original fills in the moment the cancel
  # is issued (a normal race; a filled order cannot be cancelled) the book ends
  # up with 2x the risk-approved quantity and the risk engine counts one entry.
  # A slightly worse fill is a far cheaper problem than a doubled position on
  # the account judges read.
  chase:
    enabled: false
  # 1.0 = post AT the far touch, i.e. fully marketable on arrival.
  #
  # The default 0.5 prices halfway between mid and the touch
  # (`pricer.py:56`), and with the chase disabled `max_steps` is 1, so `step`
  # is always 0 and the ratio is always exactly 0.5. There is no second
  # attempt to walk it in. On this profile the order is, by construction, a
  # resting order that never crosses the spread - it fills only when the
  # market happens to come to it inside `fill_settle_seconds`. The one order
  # this account ever approved (QQQ 0-DTE, 31 Aug) filled the ratio to 2.94
  # only because the market was a single cent wide and the arithmetic rounded
  # onto the touch. Anything wider rests and dies.
  #
  # The cost of 1.0 is the full half-spread, which is already bounded: the
  # spread gate refuses anything wider than 4% of mid and the cost model
  # charges the round trip against the profit target. The cost of 0.5 on this
  # profile is not trading.
  limit_price_ratio: 1.0
  # ...and 1.0 STILL did not fill. 2 Sep, three orders, every gate green, every
  # one dead as `unfilled after 20s at <the ask>`: SPY 765C at 1.51, IWM 293C at
  # 0.78, QQQ 704P at 2.25 - each posted at exactly the quoted ask, each
  # cancelled by our own router twenty seconds later. A marketable limit that
  # does not fill in twenty seconds is not a marketable limit.
  #
  # The quote is the problem, not the ratio. `data.option_feed: indicative` is
  # the free tier and serves DELAYED quotes (the payloads show it: asof,
  # open_interest, volume, iv_source all null), so the "far touch" is a touch
  # from up to fifteen minutes ago. And the error is BIASED, not random:
  # intraday_momentum enters after a VWAP cross, buying calls into an up-move
  # and puts into a down-move, so the live offer has by construction moved away
  # from the stale one - by roughly the move that triggered the entry. The
  # limit sits below the real market every time.
  #
  # 10% of the touch, floor 2c. That is a guess at the size of a fifteen-minute
  # gap on a 1-DTE contract, deliberately smaller than the delta-times-ATR
  # estimate (~27% of premium on the 2 Sep SPY idea), which is what it would
  # cost to be certain. The right fix is `option_feed: opra` - a paid feed -
  # after which BOTH of these go back to 0.0.
  #
  # The pad cannot outspend the risk engine: router._quantity_within_approved_risk
  # shrinks the quantity so the padded max loss stays inside the approved
  # dollars. See `claude/limits-priced-off-a-delayed-feed.md`.
  stale_quote_pad_pct: 0.10
  stale_quote_pad_min: 0.02

risk:
  # Raised from 4 on 27 Aug. Self-imposed, not a hackathon rule. At 4/day the
  # judged 5-6 session window could open at most 20 positions and, measured,
  # expected fewer than two. The daily loss halt below is the real protection
  # for an account judges read in full - a position count is a poor proxy for
  # it, because it caps upside and downside equally.
  # 20, raised from 12 on 27 Aug. intraday_momentum alone is now allowed 12 a
  # day, so a global cap of 12 would have silently pre-empted the carry book
  # entirely once the day book got going. The daily LOSS limit below is the
  # control that should bind, not a position count.
  max_new_positions_per_day: 20
  # 0.01 from 30 Aug, lowered from 0.015 to MATCH config/dev.yaml. While the
  # two differed, every backtest run on dev described a different strategy
  # from the one the judged account trades: same code and same data gave
  # +$846.61 on dev and -$237.18 on judged for 2026-08-17..21, because 50%
  # larger positions burn the net_delta budget faster and the cap then
  # refuses entries dev accepted (41 trades vs 44). This file's own header
  # says 'tighter, slower' - 1.5% against dev's 1.0% was the opposite.
  max_risk_per_trade_pct: 0.01
  daily_loss_limit_pct: 0.03

telemetry:
  run_dir: "runs/judged"
  journal: "runs/judged/journal.jsonl"
  db: "runs/judged/oaa.sqlite"
  equity_curve: "runs/judged/equity.csv"
