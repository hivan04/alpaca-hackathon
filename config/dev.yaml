# Overlay applied when OAA_PROFILE=dev (the default).
# Throwaway paper account. Break things here.
profile: dev

broker:
  paper: true

execution:
  # false since 29 Aug: the backtesting account now runs LIVE alongside the
  # judged one. Both are paper accounts, and this one exists to be the place a
  # book is proved before it reaches the account judges read. A book that has
  # only ever run dry has not been proved.
  dry_run: false

risk:
  max_new_positions_per_day: 20
  max_risk_per_trade_pct: 0.01

telemetry:
  run_dir: "runs/dev"
  journal: "runs/dev/journal.jsonl"
  db: "runs/dev/oaa.sqlite"
  equity_curve: "runs/dev/equity.csv"
  log_level: DEBUG
