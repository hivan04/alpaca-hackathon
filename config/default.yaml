# =============================================================================
# Eventus Algorithm - master configuration
# -----------------------------------------------------------------------------
# Everything the system does is driven from this file. Nothing here is a secret;
# credentials live in .env and are referenced by name only.
#
# Override order (later wins):
#   config/default.yaml  ->  config/<profile>.yaml  ->  config/local.yaml  ->  env vars (OAA_*)
# =============================================================================

meta:
  project: "Eventus Algorithm"
  # The hackathon track, submitted verbatim. NOT the project name - renaming
  # this would mis-file the entry.
  track: "Options Alpha Agents"
  version: "0.1.0"

# -----------------------------------------------------------------------------
# Which account we point at. `dev` is the throwaway, `judged` is the account ID
# submitted to the judges. Keeping these apart is the single most important
# operational rule of the week - see docs/RUNBOOK.md.
# -----------------------------------------------------------------------------
profile: judged         # judged is the only profile in use (env: OAA_PROFILE)

broker:
  # cli   -> alpaca CLI subprocess. THE EXECUTION PATH. Every order is a shell
  #          command you can paste into a terminal and replay.
  # mcp   -> Alpaca MCP server over stdio. The AI assistant's read/reason
  #          surface, and a drop-in execution path if the CLI is unavailable.
  # rest  -> alpaca-py SDK. Only path with websocket streaming.
  # sim   -> nothing leaves the process; everything is logged.
  primary: cli
  fallback: sim
  paper: true
  # Every order carries a deterministic client_order_id so a retry after an
  # ambiguous failure can never double-fill.
  idempotency: true
  # Reject any order the risk engine has not stamped. Hard safety interlock.
  require_risk_approval: true

  cli:
    binary: alpaca
    profile: null           # ~/.config/alpaca/profiles/<name>; null = active profile
    timeout_seconds: 30

  mcp:
    command: uvx
    args: ["alpaca-mcp-server"]
    transport: stdio        # stdio | streamable-http
    url: "http://127.0.0.1:8000/mcp"   # used when transport=streamable-http
    # EMPTY ON PURPOSE (30 Aug). These names were passed to the server as
    # ALPACA_TOOLSETS to trim its 72-tool surface. This server build does not
    # recognise them, so it registered **zero** tools and started up perfectly
    # happily - `oaa mcp-tools` printed an empty table and the live agent booted
    # with no MCP surface at all. A filter that silently means "nothing" is
    # worse than no filter.
    #
    # Nothing is lost by removing it, because the server-side list was never the
    # safety property. `agents/tools.py:mcp_read_tools` filters to
    # MCP_READ_ALLOWLIST - seven read-only tools - and withholds every mutating
    # one, so the model cannot see `place_option_order` or `close_all_positions`
    # whatever the server registers. That filter is in code and is tested.
    #
    # Restore a filter only with names verified against `oaa mcp-tools`.
    toolsets: []

data:
  # cli -> `alpaca data ...` subprocesses. Same binary as execution, so the
  #        backtest and the live agent read through one auditable path.
  provider: cli
  stock_feed: iex           # iex (free) | sip (Algo Trader Plus)
  option_feed: indicative   # indicative (free) | opra (paid)
  # Free tier withholds the last 15 minutes of historical data. The engine
  # accounts for this rather than silently trading on stale marks.
  delayed_minutes: 15
  # The intraday book needs a session VWAP; daily bars cannot express one.
  fetch_intraday: true
  # 1Min from 27 Aug. On 5-minute bars the momentum book's `min_bars: 30` floor
  # is not met until 12:00 ET, which with the lunch skip left it a 13:30-14:45
  # window - 75 minutes a day for the book nominally running as PRIMARY. At one
  # minute the floor clears by 10:00 and the whole session is reachable.
  intraday_timeframe: "1Min"
  intraday_lookback_days: 5
  # Per-symbol headlines for the intraday catalyst gate - Alpaca-native, so
  # there is no scraper to maintain and nothing to break on day three.
  fetch_news: true
  news_limit: 20
  news_lookback_hours: 6
  cache:
    enabled: true
    dir: "data/cache"
    ttl_seconds: 60
  rate_limit:
    requests_per_minute: 190   # keep headroom under Alpaca's 200/min
    burst: 20

universe:
  # Liquid, tight-spread option underlyings. Keep this short - each name costs
  # chain requests, and the free data budget is 200 req/min.
  # Index and sector ETFs only. See the rule in
  # config/strategies/vol_carry.yaml: measured spread, effective independent
  # bets, and no idiosyncratic event risk in a short-vol book.
  #
  # This is the SUPERSET the replay fetches, not what any one book trades.
  # Each strategy filters it through its own `universe:` (engine.py:692), so:
  #   vol_carry           all 14 - it wants the breadth, and it is the book
  #                       whose failure mode is every position losing at once
  #   intraday_momentum   8 - see config/strategies/intraday_momentum.yaml
  #   event_premium       SPY, QQQ
  #
  # Widened from 8 on 30 Aug. `vol_carry.yaml` had declared these 14 since
  # 28 Aug, but a MULTI-strategy run never read it: cli.py `_strategy_universe`
  # returns [] unless exactly one strategy is picked, so the run fell back to
  # this list and the carry book silently traded 8 of its 14. The extra six
  # were never fetched and nothing in the output said so. Keep this list a
  # superset of every strategy's own universe, or the same thing happens again.
  #
  # Each name costs chain requests against a 200/min budget - 14 names is a
  # materially longer first (uncached) run.
  symbols: [
    "SPY", "QQQ", "IWM", "DIA",      # broad equity
    "XLF", "XLE",                    # sectors - XLE is the only NEGATIVE correlation
    "TLT", "GLD",                    # decorrelated: rates, gold
    "XLV", "XLU",                    # defensive sectors - the two least correlated
    "EEM", "EFA", "FXI",             # non-US equity - a different macro driver
    "SLV",                           # metals - a second, distinct vol to GLD
  ]
  min_underlying_price: 20.0
  max_underlying_price: 1500.0
  exclude: []
  # Skip names with earnings inside the window unless a strategy opts in.
  avoid_earnings_within_days: 2

# -----------------------------------------------------------------------------
# Option contract selection defaults. Strategies inherit these and may override.
# -----------------------------------------------------------------------------
options:
  min_days_to_expiry: 3
  max_days_to_expiry: 45
  min_open_interest: 250
  min_volume: 10
  max_bid_ask_spread_pct: 0.12     # (ask-bid)/mid
  min_option_price: 0.10
  # Removed 29 Aug (was 25.00). This is a per-CONTRACT filter, so on an
  # underlying above roughly $350 it stripped the near-the-money strikes and
  # left the cheap far-OTM ones: the chain was not empty and nothing raised,
  # but `atm()` priced an OTM strike as ATM and `by_delta(0.45)` resolved to
  # whatever delta survived. It refused nothing and distorted quietly, which
  # is the worst shape a gate can have. Position size is bounded by max loss
  # in the risk engine, which is the right place for it.
  max_option_price: null
  strike_selection: delta          # delta | moneyness | strike
  contract_multiplier: 100

# -----------------------------------------------------------------------------
# DISCOVERY AND THE MACRO LENS
# -----------------------------------------------------------------------------
# Four deterministic specialists already run (vol, trend, event, statarb). The
# one lens they cannot supply is macro, because it means reading unstructured
# text rather than computing a number.
#
# Two disciplines, both enforced in code:
#
#  1. Attention GENERATES CANDIDATES; cointegration still decides. A name that
#     just became hot is one whose historical relationship may be breaking -
#     screening a buzz list at face value selects for exactly the wrong names.
#
#  2. Nothing here feeds the gap model's features. most-actives and movers are
#     live snapshots with no history, so a feature built on them could not be
#     replayed and would silently poison the walk-forward backtest. Only `news`
#     is replayable, and discovery stays an OVERLAY on a model that remains
#     independently testable.
#
# The judgement that matters is not "is this name hot" but "is it hot for a
# reason its pair partner shares?" A sector-wide move leaves the spread intact.
# An idiosyncratic one dislocates it on news that will never mean-revert. Both
# look identical in a volume count; telling them apart needs reading.
# -----------------------------------------------------------------------------
discovery:
  enabled: true

  sources:
    # Alpaca answers "what's hot" itself - no scraper to maintain, no ToS
    # exposure, and it scores better on Technology Implementation than a
    # BeautifulSoup script. A scraper that dies on day 3 costs the P&L window.
    most_actives:
      enabled: true
      limit: 30
    movers:
      enabled: true
      limit: 20
    news:
      enabled: true            # the ONLY replayable source - backtest-safe
      lookback_days: 3
      baseline_days: 20        # velocity vs baseline, not raw article count
      # Alpaca's hard maximum. Anything higher is a 400 that takes the whole
      # news source down - and news is the only component that surfaces
      # large-caps, so losing it biases discovery entirely toward penny movers.
      limit: 50
    # Escape hatch for any JSON endpoint you have rights to call: a sentiment
    # vendor, a sponsor feed, an official social API. Contributes to the same
    # score. See docs/DISCOVERY.md.
    external:
      enabled: false
      url: ""
      symbol_path: "data[].symbol"
      score_path: "data[].score"
      api_key_env: ""

  # How much each source counts. News is weighted highest: it is replayable and
  # it carries a REASON. Volume is weighted lowest - a mega-cap is always in the
  # most-actives list and that fact carries almost no information.
  weights:
    news: 0.40
    movers: 0.35
    most_actives: 0.15
    external: 0.10

  filters:
    min_price: 10.0
    max_price: 1500.0
    min_dollar_volume: 50000000.0
    require_optionable: true
    # THE ONE THAT BITES SILENTLY. The pairs trade shorts a leg; a candidate
    # that cannot be borrowed fails at 15:55 with the collar already bought.
    require_shortable: true
    # Leveraged/inverse products decay on daily rebalance, so they cointegrate
    # with nothing. They show up in most-actives constantly.
    exclude_leveraged: true
    min_history_days: 250
    exclude: []

  pool:
    path: "runs/candidate_pool.json"
    # The pool ACCUMULATES. A name hot on Tuesday and quiet on Wednesday is
    # still a candidate. Approval is additive-only: pairs enter when they pass
    # cointegration and are never dropped for falling off today's buzz list.
    accumulate_days: 10
    max_symbols: 40
    seeds: ["XLE", "XOP", "QQQ", "XLK", "KO", "PEP", "XOM", "CVX"]

  macro:
    enabled: true
    use_llm: true              # false -> deterministic breadth rule, zero cost
    max_symbols: 15
    max_headlines: 25
    # Deliberately high. With only ~5 overnight entries in the competition,
    # standing down twice costs 40% of the sample. Reduce beats stand_down.
    stand_down_threshold: 0.75

  max_filter_checks: 25

# -----------------------------------------------------------------------------
# THE CAPITAL FIREWALL
# -----------------------------------------------------------------------------
# One account, three books:
#
#   carry          RESIDENT. Short-premium defined-risk structures held 3-10
#                  sessions. Margin reserved FIRST, never lent out. Not
#                  flattened nightly - theta accrues on calendar days, and a
#                  nightly round trip would pay the spread for nothing.
#   intraday       TRANSIENT. Long premium, flat by 15:15, every session.
#   opportunistic  TRANSIENT, dormant by default. Same 15:15 cutoff.
#
# Layer 1 is temporal: each book trades only inside its own window.
# Layer 2 is capital: the transient lease is whatever Reg T leaves AFTER the
# carry book's requirement is subtracted, measured on a FRESH poll.
#
#   15:15  transient cutoff   cancel working orders, liquidate the transient
#                             books ONLY, POLL UNTIL CONFIRMED FLAT, release
#   15:45  carry verification re-poll, confirm zero transient exposure and zero
#                             working orders, read FRESH Reg T buying power,
#                             confirm carry margin covered with headroom
#
# Any failure at 15:45 disables the transient books for the FOLLOWING session.
# A book that needed rescuing does not get fresh leverage the next morning.
#
# Which leg belongs to which book is tracked in a persisted ledger, so a
# restart at 15:10 cannot cause the cutoff to liquidate a resident condor.
# Unattributed legs are treated as transient: closing something we did not
# deliberately choose to hold is the recoverable error.
# -----------------------------------------------------------------------------
firewall:
  enabled: true
  times:                              # all US/Eastern
    market_open: "09:30"
    intraday_start: "09:45"           # the open is wide and unstable
    carry_entry_start: "10:00"
    intraday_last_entry: "14:45"      # runway before the cutoff
    carry_entry_end: "15:00"
    intraday_cutoff: "15:15"          # THE hard cutoff
    carry_verification: "15:45"       # the sign-off
    market_close: "16:00"
  ledger_path: "runs/position_ledger.json"
  # `close_all_positions` returning 200 means accepted, not filled. We poll.
  liquidation_confirm_attempts: 4
  liquidation_confirm_delay_seconds: 5.0
  emergency_liquidate: true
  carry_max_equity_pct: 0.50          # resident book's gross ceiling
  transient_utilisation: 0.50         # of what Reg T leaves after carry
  transient_max_equity_pct: 0.15      # second, absolute ceiling
  carry_margin_cushion: 1.25
  min_trade_value: 500.0

# -----------------------------------------------------------------------------
# Risk. These are hard, deterministic limits enforced in Python before any
# order is routed. No LLM can talk its way past them.
# -----------------------------------------------------------------------------
risk:
  # Raised 27 Aug. These are SELF-IMPOSED limits, not hackathon rules - the
  # event sets no position caps. The old 12/6 pair was the binding constraint
  # on trade count (max_positions rejected 11 candidates in a 61-session run),
  # and at 0.3 trades per session the judged 5-6 day window expected fewer
  # than two trades. The portfolio risk cap below still bounds total exposure,
  # so this raises TURNOVER rather than aggregate risk.
  max_positions: 25
  max_new_positions_per_day: 12
  # 1, lowered from 2 on 27 Aug. The check is `max_positions_per_underlying x
  # len(legs)`, so 1 means ONE structure per underlying per book at a time.
  # Measured: four NVDA condors open across 28-30 July contributed $2,863 of a
  # $4,852 drawdown. Short vol on one name stacked is one bet, not four.
  max_positions_per_underlying: 1
  # Fraction of account equity at risk in a single defined-risk structure.
  max_risk_per_trade_pct: 0.02
  # Total defined-risk exposure across all open structures.
  max_portfolio_risk_pct: 0.20
  # Delta-equivalent notional ONE structure may control, as a multiple of
  # equity. 0.10 sat here for weeks and was read by nothing; measured over 44
  # approvals the median structure controls 1.12x equity, so 0.10 would have
  # refused literally every trade the book has ever made. Set just above the
  # observed max of 4.89x, so it bounds a pathological single structure and
  # cannot fire on anything the book has actually done.
  max_notional_per_trade_pct: 5.5
  min_cash_buffer_pct: 0.15
  # Naked/undefined-risk structures are refused outright. Judged on a one-week
  # P&L window, a single uncapped loss ends the run.
  allow_undefined_risk: false
  # --- aggregate GREEK caps, enforced from 30 Aug --------------------------
  # These bound CORRELATION, which no other limit here can see: max_positions,
  # max_new_positions_per_day and max_positions_per_underlying all count
  # structures, and twenty-five structures that are one bet pass all three.
  # Measured 28 Aug, the intraday universe behaves like 2.4 independent bets.
  #
  # Both numbers below are set from a measure-only calibration run (44
  # approvals), NOT carried over - the previous values had never been enforced,
  # so nothing had ever been calibrated against them, and both were wrong in
  # opposite directions:
  #
  #                       measured median   p90     max    old (unenforced)
  #   delta / equity           1.47x       3.55x   5.24x       0.35
  #   vega $/pt per $10k        $7          $14     $27         $50
  #
  # 0.35 would have refused essentially every trade the book makes; $50 would
  # never once have fired. That is what an uncalibrated limit looks like from
  # both sides.
  #
  # SET JUST ABOVE THE OBSERVED MAXIMUM, not at p90, and the difference was
  # measured rather than argued. Same window, same seed, caps the only change:
  #
  #                        trades   net P&L   win rate   PF    caps fired
  #   measure only            44    +$960.15    52.3%   1.30      -
  #   p90 (delta 3.5, v 15)   39      -$3.02    46.2%   1.00   7 delta, 2 vega
  #
  # The nine refusals removed five trades that happened to be worth ~$960 on
  # this sample. That is a real cost and it is not evidence the cap is wrong -
  # a tail control is not supposed to pay for itself on a window where the tail
  # did not occur, and this window contains no stress day. But it is also not
  # evidence the cap is RIGHT, and paying a known cost for an unmeasured
  # benefit two days before the entry cutoff is a bad trade.
  #
  # So these sit just above the highest reading the book has ever produced
  # (delta 5.24x, vega $27). They cannot fire on behaviour that has been
  # observed, and they DO stop it creeping past it - which is the actual
  # request. Going from unbounded to bounded-at-the-observed-max is most of the
  # protection for none of the measured cost.
  #
  # To tighten to p90 later, set 3.5 / 15.0 and expect the table above.
  # <= 0 means MEASURE ONLY - computed and journalled, nothing refused.

  #: |net dollar delta| / equity. 5.5 = a 1% move in the underlyings moves the
  #: book by 5.5% of equity. Observed max 5.24.
  max_net_delta: 5.5
  #: |net vega| in dollars per vol POINT, per $10k of equity. Observed max 27.
  max_net_vega: 30.0
  daily_loss_limit_pct: 0.04       # halt trading for the day past this
  max_drawdown_halt_pct: 0.15      # halt entirely past this
  # Refuse to trade in the first/last N minutes - spreads are widest there.
  no_trade_open_minutes: 5
  no_trade_close_minutes: 10

execution:
  order_type: limit
  # atomic -> one multi-leg order. Legging doubles spread exposure, so it is a
  # fallback for venues that cannot route combos, not a default.
  multileg_mode: atomic                # limit | market  (limit strongly preferred)
  # Where inside the bid/ask to price. 0.5 = mid, 0.0 = bid, 1.0 = ask.
  limit_price_ratio: 0.5
  # Walk the limit toward the far touch if unfilled.
  chase:
    enabled: true
    steps: 3
    interval_seconds: 20
    max_slippage_pct: 0.15
  time_in_force: day
  cancel_unfilled_after_seconds: 180
  # Dry run logs the exact payload without submitting. Flip to false to go live.
  dry_run: true

# -----------------------------------------------------------------------------
# Strategies. Each entry names a registered strategy plugin and its params.
# Add a file to src/oaa/strategies/, register it, add a block here. Done.
# -----------------------------------------------------------------------------
strategies:
  # --- CARRY BOOK (resident, 10:00-15:00 entries, held 3-10 sessions) --------
  - name: vol_carry
    enabled: true
    weight: 1.0
    book: carry
    params_file: "config/strategies/vol_carry.yaml"

  # --- INTRADAY BOOK (09:45-14:45 entries -> 15:15 hard cutoff) -------------
  # Disabled by default. This book is BUILT SECOND and opted into explicitly:
  # judges see the full history of the submitted account, and a malfunctioning
  # intraday loop firing junk orders is permanently on the record. The carry
  # book's P&L is the asset being protected here.
  - name: intraday_momentum
    enabled: true
    weight: 1.0
    book: intraday
    params_file: "config/strategies/intraday_momentum.yaml"

  # --- OPPORTUNISTIC BOOK (dormant unless a scheduled print is due) ---------
  - name: event_premium
    enabled: true
    weight: 0.5
    book: opportunistic
    params_file: "config/strategies/event_premium.yaml"

  # --- EVENTS BOOK (armed on a date, not a signal) ---------------------------
  # Wired into `oaa run` on 30 Aug. Until then it was `oaa events arm` in its
  # own process, which meant the book only traded if a human remembered to
  # start it - the exact failure mode a "fully autonomous" submission cannot
  # have.
  #
  # It is listed here so the runtime switchboard can stand it down mid-week,
  # and so `oaa strategies` reports it honestly. It is NOT a firewall tenant:
  # `book: events` is excluded from the carry/intraday/opportunistic lists the
  # scan cycles iterate, and its cycles build their own RiskEngine with
  # firewall=None. See Orchestrator._events_engine for why.
  #
  # The model's role here differs from every other book: elsewhere it scores
  # what the rules proposed, here it JUDGES direction from the sentiment
  # circulating before a print. An abstention is a valid answer and the
  # abstention rate is warned on when it hits zero.
  - name: earnings_event_directional
    enabled: true
    weight: 1.0
    book: events
    params_file: "config/strategies/earnings_event.yaml"

# -----------------------------------------------------------------------------
# The agent layer. Specialist proposers run in parallel, a critic scores them,
# a deterministic risk guard has the final veto. Fully autonomous: no human gate.
# -----------------------------------------------------------------------------
agents:
  enabled: true
  llm:
    # The LIVE loop's provider. The backtest has its own - see
    # backtest.critic.llm below - because a replay scores every candidate in
    # every session and is re-run constantly, while a live cycle is a handful
    # of calls a day.
    # Featherless AI, the event's inference partner, is the live provider.
    # Two reasons beyond the partnership: the open-weight models are cheap
    # enough to run every cycle of a seven-day event without metering, and
    # Qwen3 supports OpenAI-style tool calling - which is what lets the agent
    # drive the Alpaca MCP tools directly instead of being handed a summary.
    provider: featherless        # featherless | anthropic | openai | null
    model: "Qwen/Qwen3-32B"      # tool-calling capable; moonshotai/Kimi-K2-Instruct
                                 # is the heavier alternative
    api_key_env: FEATHERLESS_API_KEY
    base_url: "https://api.featherless.ai/v1"
    temperature: 0.2
    max_tokens: 4000
    timeout_seconds: 90
    seed: 11                     # same verdict twice from the same evidence
    # Serverless inference cold-starts. A 429 one second into the 09:45 cycle
    # must not cost that cycle its reasoning.
    max_retries: 3
    retry_backoff_seconds: 1.5
    # If the LLM is unreachable the loop degrades to deterministic rules
    # rather than stopping. Uptime beats cleverness on a P&L-scored week.
    fallback_to_rules: true
  # The agent's tool surface. `mcp` routes tool calls through Alpaca's MCP
  # server, which is what the Technology Implementation criterion rewards.
  tool_backend: mcp              # mcp | rest
  proposers:
    - vol_regime
    - trend
    - flow
  critic:
    enabled: true
    min_score_to_trade: 0.55
    require_thesis: true
  agent_cycles: ["carry_scan"]
  memory:
    enabled: true
    path: "runs/memory.sqlite"
    # Feed yesterday's realised outcomes back into today's prompts.
    lookback_days: 7

# -----------------------------------------------------------------------------
# Scheduling. The loop is autonomous - it wakes itself, it is not prompted.
# All times are US/Eastern, i.e. market local time.
# -----------------------------------------------------------------------------
schedule:
  timezone: "America/New_York"
  trading_days: ["mon", "tue", "wed", "thu", "fri"]
  # Every cycle below is a firewall boundary. The runner fires late cycles after
  # a restart, so a crash at 15:10 does not skip the 15:15 cutoff.
  cycles:
    - name: discover
      at: "09:15"
      action: discover                # pre-market: candidate pool + regime read
    # The intraday book is scanned on a 15-minute grid, NOT twice a day. A VWAP
    # cross is an event that lasts minutes: two scans observed ~30 of 390
    # session minutes and required the cross to land inside one of them. These
    # times mirror `backtest.session_times_et` exactly - when they diverged, the
    # live agent saw a sixth of what the backtest was tuned against.
    # The strategy's own time gate skips 11:30-13:30, so no lunch entries.
    - name: intraday_1000
      at: "10:00"
      action: intraday_scan           # transient books lease the headroom
    # The events book closes what reported overnight BEFORE the day books do
    # anything, and before the 10:00 scans compete for the same buying power.
    # 09:45 is also where the IV crush is - the whole reason the structure is a
    # debit vertical rather than a long call.
    - name: events_flatten
      at: "09:45"
      action: events_flatten
    # The watch. HOURLY, 04:00-16:00 ET (09:00-21:00 BST), on every name whose
    # print is within `watch.lookahead_days` - and none at all on a name that
    # has reported: once a name has printed there is nothing left to learn that
    # can inform the trade, and post-print commentary sitting in a dossier
    # would be read by a later cycle as pre-print evidence.
    #
    # Hourly rather than three-a-day (09:55/13:00/15:30 until 30 Aug) because
    # the material items - estimate revisions, guidance, a supplier's read-
    # across - do not wait for a US session. The 04:00-09:00 ET reads catch the
    # overnight and European wire and the pre-market analyst actions, which the
    # old morning cycle saw only after they were already priced.
    #
    # The cost of the extra cycles is near zero by construction: `_unseen`
    # keys every item by a hash of its timestamp and text, so a poll that finds
    # nothing new makes NO model call and writes no note. Cost scales with how
    # much news arrives, not with how often the loop runs.
    #
    # Note on restarts: `_due` fires every cycle whose time has passed today,
    # so a process started at 15:00 ET runs the earlier hourly reads back to
    # back. The first of them collects the day's items and the rest are quiet -
    # correct, and one burst rather than eleven.
    #
    # 16:00 is the last read. The arm is at 15:50, so 16:00 informs tomorrow.
    - name: events_watch_0400
      at: "04:00"
      action: events_watch
    - name: events_watch_0500
      at: "05:00"
      action: events_watch
    - name: events_watch_0600
      at: "06:00"
      action: events_watch
    - name: events_watch_0700
      at: "07:00"
      action: events_watch
    - name: events_watch_0800
      at: "08:00"
      action: events_watch
    - name: events_watch_0900
      at: "09:00"
      action: events_watch
    - name: events_watch_1000
      at: "10:00"
      action: events_watch
    - name: events_watch_1100
      at: "11:00"
      action: events_watch
    - name: events_watch_1200
      at: "12:00"
      action: events_watch
    - name: events_watch_1300
      at: "13:00"
      action: events_watch
    - name: events_watch_1400
      at: "14:00"
      action: events_watch
    - name: events_watch_1500
      at: "15:00"
      action: events_watch
    - name: events_watch_1600
      at: "16:00"
      action: events_watch
    - name: carry_scan
      at: "10:00"
      action: carry_scan              # resident book looks for rich premium
    - name: intraday_1015
      at: "10:15"
      action: intraday_scan
    - name: intraday_1030
      at: "10:30"
      action: intraday_scan
    - name: intraday_1045
      at: "10:45"
      action: intraday_scan
    - name: intraday_1100
      at: "11:00"
      action: intraday_scan
    - name: intraday_1115
      at: "11:15"
      action: intraday_scan
    # Lunch: no entries (the strategy's time gate refuses them), but the book
    # is marked and managed on the same 15-minute grid as the rest of the day.
    # A single 12:00 sweep left two 90-minute holes around it, and an intraday
    # position that cannot be exited for 90 minutes is not an intraday
    # position. These mirror `backtest.session_times_et` exactly.
    - name: lunch_manage_1130
      at: "11:30"
      action: manage_positions
    - name: lunch_manage_1145
      at: "11:45"
      action: manage_positions
    - name: lunch_manage_1200
      at: "12:00"
      action: manage_positions
    - name: lunch_manage_1215
      at: "12:15"
      action: manage_positions
    - name: lunch_manage_1230
      at: "12:30"
      action: manage_positions
    - name: lunch_manage_1245
      at: "12:45"
      action: manage_positions
    - name: lunch_manage_1300
      at: "13:00"
      action: manage_positions
    - name: lunch_manage_1315
      at: "13:15"
      action: manage_positions
    - name: intraday_1330
      at: "13:30"
      action: intraday_scan
    - name: intraday_1345
      at: "13:45"
      action: intraday_scan
    - name: intraday_1400
      at: "14:00"
      action: intraday_scan
    - name: intraday_1415
      at: "14:15"
      action: intraday_scan
    - name: intraday_1430
      at: "14:30"
      action: intraday_scan
    - name: intraday_1445
      at: "14:45"
      action: intraday_scan
    - name: carry_manage
      at: "14:30"
      action: manage_positions
    # Mirrors the backtest's 15:10 moment, which is where `exits.flat_by` fires.
    # The 15:15 cutoff below is the firewall's hard liquidation - a backstop,
    # not the plan. The book should already be flat when it runs.
    - name: late_manage_1500
      at: "15:00"
      action: manage_positions
    - name: flat_by_manage
      at: "15:10"
      action: manage_positions
    - name: intraday_cutoff
      at: "15:15"
      action: intraday_cutoff         # HARD CUTOFF - transient books only
    - name: carry_verify
      at: "15:45"                     # THE SIGN-OFF
      action: carry_verify
    # The events arm. Deliberately AFTER carry_verify: the sign-off proves the
    # transient books are flat and the carry book's margin is covered, and it
    # should not be racing an order-routing cycle for the same account
    # snapshot. Ten minutes to the close is enough for the direction call and
    # a limit fill, and is late enough that the day's tape is fully formed.
    # The LLM call lives inside this cycle - if FEATHERLESS_API_KEY is unset
    # the direction model abstains and the book opens nothing, by design.
    - name: events_arm
      at: "15:50"
      action: events_arm
    - name: eod_report
      at: "16:10"
      action: report
  monitor_interval_seconds: 300

# -----------------------------------------------------------------------------
# Position management: how we exit. Defined up front so exits are mechanical.
# -----------------------------------------------------------------------------
management:
  profit_target_pct: 0.50          # of max profit for credit structures
  stop_loss_pct: 2.0               # of credit received
  close_at_dte: 1                  # never hold into expiry - assignment risk
  roll:
    enabled: false
    dte_trigger: 7
  # Close everything before the submission deadline so final P&L is realised.
  flatten_before: null
  # Global entry cutoff, removed 29 Aug. It was written for the carry book, but
  # it gates EVERY book, and the event strategy's whole premise is arming on a
  # dated print - three of the 1-4 Sep prints (LULU, ZS, DOCU, CIEN) fall after
  # the old 2 Sep 20:00 UTC cutoff, so a global gate deletes half the week.
  # The carry book keeps its own cutoff in config/strategies/vol_carry.yaml,
  # which is where the "cannot decay before the flatten" reasoning belongs.
  # null disables the gate; entry_window_gate() and the orchestrator both
  # treat null as "no cutoff".
  entry_cutoff_utc: null
  # Flatten the ENTIRE book on the morning of submission day, well before the
  # 15:00 UTC deadline. Realised P&L on a flat account is unambiguous evidence;
  # an open book asks a judge to trust a mid-price mark on a wide quote.
  submission_flatten_utc: "2026-09-04T13:45:00Z"

# -----------------------------------------------------------------------------
# Modelled transaction costs. Paper trading charges none of this and fills
# optimistically at mid - which flatters the intraday book severely, because
# spread cost IS its primary loss mechanism. Every closed trade therefore
# carries gross P&L, modelled cost and net side by side. See COST_STRUCTURE.md.
# -----------------------------------------------------------------------------
cost_model:
  enabled: true
  occ_clearing: 0.025
  orf: 0.015
  cat_per_contract: 0.0003
  taf_sell: 0.00329
  sec_rate: 0.0000206
  modelled_slippage_per_leg: 0.02   # half-spread assumption; tune from live quotes
  margin_rate_annual: 0.0625
  index_exchange_fees:
    SPX: 0.66
    SPXW: 0.59
    VIX: 0.45
    XSP: 0.0                        # free under 10 contracts, cash settled

telemetry:
  run_dir: "runs"
  journal: "runs/journal.jsonl"    # append-only: every decision and every order
  db: "runs/oaa.sqlite"
  equity_curve: "runs/equity.csv"
  log_level: INFO
  log_format: console              # console | json
  # full | focused. What reaches the TERMINAL only. `focused` leaves on screen
  # the three things an operator watching a live run needs - research finished
  # on a name, a position opened, a position closed and what it made - plus
  # every warning and error. The REJECT lines and per-symbol evidence counts
  # still go to the journal and `oaa gates`; they stop competing for the screen
  # with the two lines a day that carry money.
  console: focused
  # Snapshot the account every N seconds so the equity curve is dense enough
  # to make a good chart for the deck.
  snapshot_interval_seconds: 300
  capture_screenshots: false

app:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  title: "Eventus Algorithm"
  # Public read-only dashboard: equity curve, open positions, decision log.
  # This is the "Application URL" submission field.
  public: true
  refresh_seconds: 15

backtest:
  start: "2026-08-17"
  end: "2026-08-21"
  initial_cash: 100000.0
  # Conservative fill model: we cross a fraction of the spread on every fill.
  # 0.0 fills at mid, which is what paper trading does and what flatters every
  # options backtest ever written. Charged on entry AND exit.
  slippage_spread_fraction: 0.5
  # Alpaca charges no COMMISSION on options, but regulatory and clearing fees
  # are passed through per contract per side, and they are not zero. From
  # Alpaca's published Brokerage Fee Schedule:
  #   OCC clearing fee   $0.025  per contract, buys and sells
  #   ORF                $0.015  per contract, buys and sells
  #   FINRA CAT          $0.0003 per contract (100 equiv. shares), both sides
  #   FINRA TAF          $0.00329 per contract, SELLS only
  #   SEC fee            0.0000206 x trade value, SELLS only
  # That is ~$0.0403 to buy and ~$0.0435 + SEC to sell, so ~$0.04 per contract
  # per side is the honest single-number approximation this field charges.
  # 0.0 understated the cost of every multi-leg structure: a 4-leg condor at
  # qty 20 is 160 contract-sides on a round trip, which is ~$6.40 the replay
  # was not charging.
  commission_per_contract: 0.04
  output_dir: "runs/backtests"
  # Sessions the replay evaluates, Eastern time. The carry book's entry window
  # is 10:00-15:00, so one 10:00 scan is the honest minimum.
  # The intraday book enters between 09:45 and 14:45 and skips 11:30-13:30, so
  # a single 10:00 scan can only ever catch one of its windows. The carry
  # book's window is 10:00-15:00 and is unaffected by the extra scans - its
  # gates still apply at each one.
  # Every 15 minutes, 10:00-14:45. A VWAP cross is an EVENT that lasts minutes;
  # sampling four times a day observed roughly 60 of 390 session minutes and
  # required the cross to land inside one of them, which is why 86% of replayed
  # candidates died at "no VWAP cross". `cross_lookback_bars` is set to cover
  # the gap between these times so no cross falls between two cycles.
  session_times_et: [
    "10:00", "10:15", "10:30", "10:45", "11:00", "11:15",
    # LUNCH: management-only. The strategy's own time gate vetoes entries from
    # 11:30 to 13:29, so these moments open nothing - they exist so that an
    # open position is still marked, stopped and time-stopped through lunch.
    # Without them the grid jumped 11:15 -> 13:30 and a position opened at
    # 11:00 ran 150 minutes unmanaged: it could not take a profit target, and
    # a spike against it went unanswered until the afternoon.
    "11:30", "11:45", "12:00", "12:15", "12:30", "12:45", "13:00", "13:15",
    "13:30", "13:45", "14:00", "14:15", "14:30", "14:45", "15:00",
    # A management-only sweep: the intraday time gate refuses entries after
    # 14:45, so this cycle exists purely so `exits.flat_by` has a moment to
    # fire on. Without it the last scan of the day was also the last chance to
    # close, and anything opened at 14:45 ran to expiry.
    "15:10",
  ]
  # Marking an open position is NOT the same job as scanning for entries. A
  # scan builds a chain, reads news and breadth and runs every gate over the
  # universe; a mark is a spot and a repricing. Running both on the 15-minute
  # grid above meant a position that lives 20-90 minutes was observed 2-6
  # times in its entire life, so the exit dials were sampled far too coarsely
  # to mean what they say - trades that did trip one overshot it ~4x, and
  # MFE/MAE was computed from two samples. Open positions are now re-marked
  # and their exits evaluated every minute; ENTRIES stay on the grid above.
  # Costs almost nothing: the loop is skipped when the book is flat and when
  # the only open positions belong to a daily-marked book (vol_carry).
  # 0 restores scan-grid-only management.
  mark_interval_minutes: 1
  news_lookback_hours: 18.0
  fetch_news: true
  min_history_days: 40
  warmup_days: 400
  cache_dir: "data/cache/backtest"

  # The critic, in replay. The live decision path is
  #   cost -> critic -> risk engine -> partner veto -> execute
  # so the replay runs the same one. See docs/BACKTEST.md.
  critic:
    # off       - skip it; diff against this to measure what the critic adds
    # heuristic - the real Critic class with the null-LLM fallback the live
    #             system degrades to. Deterministic, free. THE DEFAULT.
    # llm       - call the model. Verdicts are cached on disk by prompt hash,
    #             so a re-run costs nothing and returns identical answers.
    #             Read the reasoning with it; do NOT quote a P&L from it - the
    #             model may have the replayed period in its training data.
    mode: heuristic
    max_llm_calls: 250
    memory: true
    # The REPLAY's settings, overriding agents.llm. Set to null to share the
    # live block wholesale.
    #
    # Same provider as live since 28 Aug. Gemini used to sit here on a
    # cost-shape argument - the replay is the heavier caller, so point it at
    # the cheap model. Featherless makes that argument moot (open weights, and
    # the Chat plan bills requests flat rather than per token), and a second
    # vendor, key and SDK to keep alive through a seven-day event is a real
    # cost of its own. What survives is the settings split, which is the part
    # that was ever about correctness rather than money.
    llm:
      provider: featherless
      model: "Qwen/Qwen3-32B"      # swap to a smaller Qwen3 id if metering bites
      api_key_env: FEATHERLESS_API_KEY
      base_url: "https://api.featherless.ai/v1"
      temperature: 0.0             # a judge should not be creative
      max_tokens: 1024             # a verdict, not an essay
      seed: 7                      # reproducibility, alongside the disk cache
      timeout_seconds: 90
      max_retries: 3
      retry_backoff_seconds: 1.5
      fallback_to_rules: true

  iv_model:
    # How implied vol is MODELLED - Alpaca serves no historical chain.
    # IV is anchored to a slow EWMA of realised vol and scaled by the market's
    # own vol level, so the IV-RV spread widens when vol collapses and goes
    # negative when it spikes. A flat multiple of realised vol would make the
    # premium gate meaningless. See docs/BACKTEST.md.
    vrp_multiple: 1.13
    anchor_halflife_days: 45.0
    rv_lookback: 20
    market_beta: 0.45
    rank_lookback: 252
    market_symbol: SPY

  chain:
    # real     - list the ACTUAL contracts (expired ones included) and mark them
    #            from REAL Alpaca option bars, recovering implied vol by
    #            inverting Black-Scholes on the traded price. Contract-days with
    #            no print fall back to the surface below and are counted, so the
    #            dashboard can show how much of a run was measured.
    # modelled - the whole chain from the surface. No option API calls.
    source: real
    iv_history_days: 180           # option history pulled before `start`, so IV
                                   # rank has something real to rank against
    min_iv_observations: 20        # below this, fall back to the modelled series
    # How WIDE to list real contracts. These matter more than they look: SPY
    # lists an expiration almost every trading day, so a band that is twice as
    # wide as it needs to be is thousands of pointless contracts and hundreds
    # of pointless bar requests. A 14-delta short strike at 7-14 DTE sits ~3%
    # from spot and the wings are a few points past it, so 6% is generous.
    listing_band: 0.06
    iv_history_band: 0.03          # pre-window contracts only recover ATM IV
    iv_history_expiry_stride_days: 7   # one expiry per week is enough for that
    max_contracts_per_symbol: 12000    # backstop; if it fires, narrow the bands

    # The modelled surface. Used for gaps, for the bid-ask spread (bars are
    # OHLCV, not quotes), and for everything when source: modelled.
    skew: -0.11                    # negative = the standard equity put skew
    smile: 0.06
    term_slope: 0.02
    rate: 0.04
    strike_window_pct: 0.14
    max_strikes_per_side: 30
    min_quotable_mid: 0.03
    default_tier: single_name
    tier_map: {}                   # SYMBOL: index_etf | mega_cap | single_name | illiquid

# -----------------------------------------------------------------------------
# Technology partners. The hackathon requires sponsor tech in the pipeline; the
# partner list is published at kickoff. Each entry is loaded as an adapter from
# src/oaa/partners/ and injected at a named pipeline stage - no core code
# changes needed. See docs/PARTNERS.md.
#
# stages: data_enrichment | signal | reasoning | risk | execution | telemetry | ui
# -----------------------------------------------------------------------------
partners:
  enabled: true
  # Fail loudly if a partner adapter errors, or skip it and carry on?
  on_error: skip                   # skip | fail
  timeout_seconds: 20
  adapters:
    - name: example_partner
      enabled: false
      module: "oaa.partners.example_partner"
      stage: data_enrichment
      priority: 100
      params:
        endpoint: "https://api.example.com/v1"
        api_key_env: "PARTNER_EXAMPLE_API_KEY"
