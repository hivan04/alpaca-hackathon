# Short volatility carry via defined-risk iron condors.
# Thesis: index options persistently price implied variance above subsequent
# realised variance. Sell that premium in a structure with a hard maximum loss.
description: >
  Sells an out-of-the-money iron condor when implied volatility is rich
  relative to trailing realised volatility and the underlying is range-bound.
  Both wings are capped, so maximum loss is known at entry.

universe: ["SPY", "QQQ", "IWM"]

entry:
  # Only sell premium when the vol risk premium is actually there.
  min_iv_rank: 0.35              # 0-1, IV percentile over lookback
  min_iv_rv_ratio: 1.10          # IV / 20d realised vol
  max_trend_strength: 0.6        # skip strong trends - condors hate them
  realised_vol_lookback_days: 20
  iv_rank_lookback_days: 60

structure:
  type: iron_condor
  target_dte: [14, 35]
  short_put_delta: -0.16
  short_call_delta: 0.16
  wing_width_points: 5           # long strike distance from short
  min_credit_to_width: 0.18      # reject condors that pay too little
  quantity_mode: risk_based      # risk_based | fixed
  fixed_quantity: 1

exit:
  profit_target_pct: 0.50        # of credit received
  stop_loss_multiple: 2.0        # of credit received
  close_at_dte: 2
  # Bail if the underlying breaches a short strike by this much.
  breach_buffer_pct: 0.005
