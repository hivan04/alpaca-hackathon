# Calendar spread into an earnings IV crush. Disabled by default - it is an
# event bet, and event bets add variance to a one-week judged P&L window.
description: >
  Sells the front-month (post-earnings) expiry and buys the back month,
  harvesting the term-structure inversion that collapses after the print.

universe: ["AAPL", "MSFT", "NVDA", "AMD", "TSLA"]

entry:
  days_before_earnings: [1, 3]
  min_term_structure_inversion: 0.08   # front IV - back IV
  min_iv_rank: 0.50

structure:
  type: calendar
  front_dte: [1, 7]
  back_dte: [21, 45]
  strike_selection: atm
  quantity_mode: fixed
  fixed_quantity: 1

exit:
  close_day_after_earnings: true
  profit_target_pct: 0.35
  stop_loss_pct: 0.50
