# =============================================================================
# THE WEEKEND BOOK - BTC/USD mean reversion
# -----------------------------------------------------------------------------
# Owned entirely by src/oaa/strategies/weekend/. Nothing in this file is read by
# the options books, and nothing in config/default.yaml changes their behaviour
# because of it. That separation is the point: a coin cannot break a condor.
#
# Thesis
#   Between the Friday equity close and the Sunday evening reopen there is no
#   equity market, no macro print and no institutional flow. What is left is
#   liquidation and retail impulse - price-insensitive flow that displaces BTC
#   from its 24-hour mean without carrying information. Displacement without
#   information reverts. Displacement WITH information (a trend) does not, and
#   ADX is what tells the two apart.
#
# Long only, and that is a venue fact: Alpaca does not permit short crypto. The
# rich side of the band is an exit, never an entry.
#
# The binding constraint
#   Crypto fees are a percentage of notional, not a per-contract charge. A
#   round trip costs ~54bp all-in on the model in `costs` below. A 2-sigma
#   reversion on a 40bp band is worth 70bp gross - not enough. The `edge` gate
#   refuses anything under 2.5x the round trip, and it is expected to reject
#   more candidates than every other gate combined.
# =============================================================================

enabled: false          # `oaa weekend run --live` also requires this to be true
symbols: ["BTC/USD"]    # one symbol: tightest spread, and one bet is one bet
book: weekend

# -----------------------------------------------------------------------------
# The window. All UTC, derived from the US equity session so DST cannot drift
# it. The book CANNOT hold a position while an equity session is live, which is
# what keeps it out of the capital firewall's way entirely.
#   opens       Fri 20:05 UTC   (16:05 ET - after the 15:45 carry sign-off)
#   last entry  Sun 12:00 UTC   (8h of runway before the flatten)
#   flat        Sun 20:00 UTC   (17.5h before Monday's 09:30 ET open)
# -----------------------------------------------------------------------------
window:
  enabled: true
  open_delay_minutes: 5
  last_entry_lead_hours: 8.0
  flatten_lead_hours: 17.5

# -----------------------------------------------------------------------------
# Signal stack. Gates run cheapest-first and the first veto ends the evaluation,
# so the rejection log names the ONE number that stopped each candidate.
# -----------------------------------------------------------------------------
signal:
  timeframe: "15Min"
  lookback_bars: 96        # 24 hours - a full crypto day, not a few thin hours
  entry_z: 2.0
  exit_z: -0.25            # take the reversion just short of the mean
  adx_max: 25.0            # the regime gate: above this it is a trend
  adx_period: 14
  adx_slope_max: 4.0       # and it must not be a trend in the making
  min_sigma: 0.0035        # below this the band cannot pay the round trip
  max_sigma: 0.030         # above this the fitted mean is meaningless
  shock_bar_return: 0.015  # do not catch a knife inside a liquidation cascade
  min_edge_multiple: 2.5   # THE gate: expected reversion vs modelled cost
  min_bars: 120

# -----------------------------------------------------------------------------
# Exits. The hard stop is what makes a spot position defined-risk, which is the
# only reason `risk.allow_undefined_risk: false` can be honoured on an
# instrument with no strikes.
# -----------------------------------------------------------------------------
exits:
  atr_stop_multiple: 1.5
  min_stop_pct: 0.008
  max_stop_pct: 0.035
  max_hold_hours: 10.0
  cooldown_hours: 6.0      # a stop means the regime read was wrong; sit out

# -----------------------------------------------------------------------------
# Sizing. Risk-first, the same discipline as the options books: size from the
# distance to the stop, then cap gross notional independently.
# -----------------------------------------------------------------------------
sizing:
  book_max_equity_pct: 0.10      # the whole weekend sleeve, gross
  max_risk_per_trade_pct: 0.02   # entry-to-stop, per trade
  max_concurrent_positions: 1
  min_order_notional: 250.0
  qty_decimals: 6

execution:
  entry_limit_ratio: 0.25   # rest near the bid - buying a dislocation, no rush
  exit_limit_ratio: 0.75
  time_in_force: "gtc"      # Alpaca rejects `day` on a 24/7 asset
  reprice_after_seconds: 180
  poll_seconds: 60
  dry_run: true             # flip with --live, deliberately, once

# -----------------------------------------------------------------------------
# Cost model. Paper charges nothing and fills at the mid; both are false. These
# are Alpaca retail crypto rates plus a measured weekend half-spread.
# -----------------------------------------------------------------------------
costs:
  taker_fee_bp: 25.0
  maker_fee_bp: 15.0
  half_spread_bp: 4.0
  slippage_bp: 3.0
  maker_ratio: 0.5
