# =============================================================================
# vol_carry - the resident carry book
# -----------------------------------------------------------------------------
# Sells the IV-RV spread as defined-risk structures held 3-10 sessions.
# Four HARD gates, not a blended score: a score would let a rich-IV reading
# paper over an earnings date, which is the one trade this must never take.
# =============================================================================

# INDEX AND SECTOR ETFs ONLY. The rule, stated so it can be applied rather than
# argued case by case:
#
#   1. measured median option spread <= 2% of mid  (COST_STRUCTURE.md S5 - the
#      arithmetic that decides whether an edge survives execution at all)
#   2. a name earns its place only if it raises the number of EFFECTIVE
#      independent bets, not the ticker count
#   3. no idiosyncratic event risk in a short-volatility book
#
# Rule 3 is what removes single names, and it is mechanical rather than a P&L
# observation: the event gate excludes SCHEDULED earnings, but nothing protects
# a short condor from a surprise product headline. A basket has no such
# headline. NVDA was the demonstration - $2,863 of a $4,852 drawdown - but the
# reason to exclude it holds a priori, which is why AAPL and MSFT went too even
# though both were profitable. Keeping the winners and dropping the loser would
# have been fitting the last backtest.
#
# Run `python scripts/universe_report.py --live` to re-derive this list from
# measured spreads and correlations rather than trusting the comment.
# XLK and SMH removed 28 Aug on measured evidence, not on P&L:
#
#              spread @ chain      corr vs QQQ
#   XLK              27.94%              0.96
#   SMH              12.49%              0.91
#   QQQ               2.85%              -
#
# XLK was the worst name in the universe on BOTH criteria at once - the widest
# option market by an order of magnitude, and 0.96 correlated with a name we
# already hold. It contributed nothing QQQ does not, at ten times the cost.
# SMH is the same argument at 0.91/0.93.
#
# XLE is KEPT despite an 11.79% chain-median spread because it is the only name
# in the table that is NEGATIVELY correlated with the rest (-0.18 to -0.36).
# A short-premium book's entire failure mode is every position losing at once;
# a negatively correlated name is worth more than three more equity ETFs.
#
# Measured 28 Aug: ten symbols behaved like 2.4 independent bets. Re-run
# `python scripts/universe_report.py --live` after any change - the whole point
# of the rule is that the list follows the measurement.
# XLK and SMH removed 28 Aug on measured evidence, not on P&L:
#
#              chain spread      corr vs QQQ
#   XLK             27.94%             0.96
#   SMH             12.49%             0.91
#   QQQ              2.85%              -
#
# XLK was the worst name in the universe on BOTH criteria at once - the widest
# option market by an order of magnitude, and 0.96 correlated with a name we
# already hold. It contributed nothing QQQ does not, at ten times the cost.
# SMH is the same argument at 0.91/0.93.
#
# XLE is KEPT despite a wide chain-median spread because it is the only name in
# the table NEGATIVELY correlated with the rest (-0.18 to -0.36). A
# short-premium book's entire failure mode is every position losing at once, so
# a negatively correlated name is worth more than three more equity ETFs.
#
# Measured 28 Aug: ten symbols behaved like 2.4 INDEPENDENT BETS. Re-run
# `python scripts/universe_report.py --live` after any change - the point of the
# rule is that the list follows the measurement, not the other way round.
# EXPANDED 30 Aug. The six additions are chosen on RULE 2 (does this raise the
# number of effective independent bets?), not on expected P&L, and every one of
# them is a HYPOTHESIS until the Jan-Aug run and `universe_report.py` have been
# read. More US equity sector ETFs were deliberately NOT added: XLI/XLY/XLP run
# 0.85+ with SPY and would add tickers, not bets.
#
# Also deliberately excluded: HYG, LQD and other low-volatility instruments.
# TLT's dominant rejection is `premium` (1,958 of 3,520, "IV rank 2% is below
# the 35% floor"), and that is the general lesson - a short-premium book cannot
# harvest a name with no premium. Adding more of them repeats TLT's mistake.
#
# XLF and TLT are KEPT for this run despite zero trades in eight months: two
# successive defects (`min_price` deleting the wing, then the per-leg spread
# ceiling failing it) are what excluded them, so they have never actually been
# measured. If they still do not trade with both fixed, that is a result.
universe: [
  "SPY", "QQQ", "IWM", "DIA",      # broad equity
  "XLF", "XLE",                    # sectors - XLE is the only NEGATIVE correlation
  "TLT", "GLD",                    # decorrelated: rates, gold
  "XLV", "XLU",                    # defensive sectors - the two least correlated
  "EEM", "EFA", "FXI",             # non-US equity - a different macro driver
  "SLV",                           # metals - a second, distinct vol to GLD
]

# --- 3.1 premium gate: is vol rich? -----------------------------------------
# IV rank says vol is high FOR THIS NAME. The IV-RV spread says you are being
# paid more than the stock has actually been moving. Both required; either
# alone is a known false-positive generator.
premium_gate:
  # Lowered from 0.70 on 27 Aug. Measured: 304 of 304 replayed candidates were
  # rejected by this one gate, and observed IV rank never exceeded 38%. A 70%
  # floor is a genuinely rare state - over a 5-6 session judged window it is
  # close to a coin flip whether it occurs at all, which is not a strategy, it
  # is a lottery ticket. 35% sells less-rich premium, so expect a lower win
  # rate and a smaller credit per trade; the IV-RV spread gate below is what
  # still has to be cleared, and it is the one carrying the actual edge.
  iv_rank_min: 0.35
  iv_rank_lookback_days: 252
  iv_rv_spread_min: 0.03           # 3 vol points

# --- 3.2 trend gate: is it going nowhere? -----------------------------------
# Short premium is short movement. This is the SAME measurement that fires
# momentum_debit_spread, removed 29 Aug. The gate stays: it is a statement
# about when THIS book should not trade, not a handoff to another one.
trend_gate:
  adx_max: 25
  max_trend_strength: 0.60
  keltner_atr_mult: 2.0

# --- 3.3 event gate: hard exclusions ----------------------------------------
event_gate:
  exclude_earnings_in_window: true   # IV is elevated BECAUSE of the event
  exclude_exdiv_short_calls: true    # assignment risk on the short call

# --- 4. structures -----------------------------------------------------------
# 7-14 DTE, not the conventional 20-45. Theta is steeply non-linear into
# expiry: at 30 DTE a five-session hold captures ~20-25% of remaining decay;
# at 10 DTE it captures the majority. The judged window is the constraint and
# the structure's life has to fit inside it. The cost is gamma, and this is a
# deliberate trade of tail risk for realised P&L inside the window - right for
# seven days, wrong for a live book. Say so in the deck.
structures:
  # 25-delta shorts, raised from 14 on 27 Aug. The reasoning, because the number
  # looks reckless next to conventional short-premium practice and is not:
  #
  # The BREAKEVEN hit rate is set entirely by the exit pair (stop / (target +
  # stop) = 75% at 50%/1.5x). It does not move when the strikes move. What DOES
  # move is the credit: 14-delta shorts collect ~17% of width, 25-delta ~30%,
  # so return on risk per trade roughly doubles (10% -> 21%) against an
  # unchanged bar.
  #
  # The cost is that the true hit rate falls as the shorts approach the money -
  # roughly 72% of condors expire inside 14-delta wings against ~50% inside
  # 25-delta ones, though taking 50% of max profit early beats both. Whether the
  # realised hit rate stays above 75% is EMPIRICAL, and this setting is a
  # hypothesis to be measured, not a conclusion. If backtests over a real chain
  # show the hit rate falling below 75%, this goes back to 0.20 or 0.14.
  #
  # Side effect worth knowing: max loss per structure falls (width - credit =
  # 5 - 1.5 = $350 against $424 at 14 delta), so risk-based sizing will trade
  # MORE contracts for the same equity risk.
  short_delta_target: 0.25         # 22-28 delta short strikes
  # Wings as a FRACTION OF SPOT. 1.5% is close to the 5 points this book has
  # been trading on SPY, so index behaviour is roughly unchanged - but it now
  # means the same thing on TLT and GLD as it does on SPY, instead of being a
  # several-percent wing on the cheap names and under one percent on the dear
  # ones. `wing_width_points` below is the fallback if this is unset.
  wing_width_pct: 0.015
  wing_width_points: 5
  dte_min: 7
  dte_max: 14
  # A 5-wide 14-delta condor prices around 0.15-0.20 of its width. Below 0.15
  # the credit is not paying for the tail and the trade is a coin flip with
  # transaction costs attached.
  min_credit_to_width: 0.15
  fixed_quantity: 1
  # Only the macro lens may set a lean; the numeric gates have already
  # established there is no trend to lean on.
  allow_directional_lean: true

# --- 5. sizing ----------------------------------------------------------------
# Size from MAX LOSS, not from capital, and explicitly NOT as a fraction of
# Reg T buying power - that is near-full 2x leverage. Position count is the
# primary defence against short-gamma tail risk: five uncorrelated positions
# at 1.5% behave very differently from one at 7.5% when one is tested.
sizing:
  risk_fraction_per_position: 0.015
  # REMOVED 30 Aug - `max_concurrent_positions` was read by no code path.
  # `risk.max_positions` (25 structures) is the control that binds.
  max_aggregate_risk: 0.08

# --- 6. exits -----------------------------------------------------------------
# 30%, not the conventional 50%. A target rarely reached leaves positions open
# at judging, which makes the P&L an unrealised mark on wide option spreads -
# noisy, unflattering, and marked at a mid the account could not trade at.
# Taking 30% converts decay into realised gains inside the window and produces
# more CLOSED trades: win rate, average hold and per-trade attribution only
# exist for closed trades, and the equity curve becomes a curve rather than one
# flat line with a single mark at the end. The cost is EV per trade. Over a
# longer horizon 50% is better; over five sessions, realised beats theoretical.
# BREAKEVEN ARITHMETIC (recomputed 27 Aug, and it drove the numbers below).
# A win is +target x credit, a loss is -stop x credit, so the hit rate that
# breaks even is  stop / (target + stop)  before costs:
#
#   target 30% / stop 2.0x  ->  87.0%   <- the old setting
#   target 50% / stop 1.5x  ->  75.0%   <- this one
#
# The observed win rate on the first real-data run was 88%. At 30%/2.0x that
# left ONE point of margin before any spread cost, and the affordable spread
# was 2.4% of credit against a gate that admitted 20%. Every trade the cost
# gate passed was one the arithmetic said would lose. 50%/1.5x moves breakeven
# to 75% and makes the cost gate below honest.
#
# The cost: a 50% target closes fewer trades inside a five-session window, so
# more positions are marked rather than realised at judging. That trade-off is
# real and was the reason for 30% - but 30% was buying realised trades at the
# price of negative expectancy, which is not a trade worth making.
exits:
  profit_target_pct: 0.50
  dte_floor: 3
  # Hard time stop in days. 0 = off, which is the default and the tested
  # setting. Decay goes as sqrt(time), cost is fixed per round trip: measured
  # at a 10-DTE entry, a 2-day hold collects 10.6% of the credit and pays 70%
  # of it back in spread and fees; 3 days collects 16.3% and pays 45%. If you
  # enable this, drop `profit_target_pct` to roughly the decay the hold can
  # actually reach - a 50% target needs 7-8 days.
  max_hold_days: 0                     # gamma rises sharply into expiry
  loss_multiple_of_credit: 1.5
  # Hard per-structure dollar stop, checked before the credit-relative one.
  # 1.5x the credit is a ratio, so a wide structure with a fat credit is allowed
  # a proportionally fat loss - which is backwards when the constraint that
  # actually matters is `risk.daily_loss_limit_pct` on a $100k account. At 3%
  # the daily halt is $3,000; a single trade should not be able to spend a
  # third of that. 0 disables the check.
  # Lowered from 900 to 450 on 27 Aug. At 900 the stop NEVER FIRED: measured
  # over 55 real trades the six largest losses were $780-$868, all of them
  # sitting just underneath it, and every one exited on the DTE floor instead -
  # which realises whatever has accumulated rather than capping it. A stop set
  # above the loss distribution is decoration.
  max_loss_usd: 450
  # One entry per underlying per SESSION for this book. The global 60-minute
  # default is sized for the intraday book; on a 10:00-15:15 scan grid it let
  # the same NVDA condor open at 14:00 and again at 15:15.
  reentry_cooldown_minutes: 1440
  defensive_mode: close_tested_side
  # Carry entry cutoff, DISABLED 1 Sep alongside management.submission_flatten_utc.
  # Its whole justification was "do not open a structure that cannot decay
  # before the submission flatten". There is no submission flatten any more, so
  # the gate now only silences the resident book for no reason. null disables
  # it: entry_window_gate() returns ok when parse_utc() yields None.
  entry_cutoff_utc: null

# --- cost gate ----------------------------------------------------------------
# Underlying selection is a liquidity decision as much as a vol decision. A
# name with rich IV and a 30c-wide quote is worse than one with moderately rich
# IV and a 5c-wide quote.
cost:
  max_relative_spread: 0.10
  # Round-trip spread as a fraction of the CREDIT RECEIVED. COST_STRUCTURE.md
  # §5 suggests 0.15, but that figure was written for a two-leg vertical; a
  # four-leg condor crosses four spreads on the way in and four on the way out,
  # so the same underlying quote width lands roughly twice as heavily here.
  # Left at 0.20, and the reasoning matters more than the number.
  #
  # A four-leg condor crosses EIGHT half-spreads on a round trip. Even on
  # 2%-wide quotes that is ~18% of a typical credit - so a ceiling much below
  # 20% does not tighten the strategy, it deletes it. The gate was never the
  # problem.
  #
  # What was wrong is that under the OLD exits (30% / 2.0x) a trade at this
  # ceiling needed a 95.7% hit rate to break even, against 88% observed: the
  # gate was admitting trades the arithmetic said would lose. Under 50% / 1.5x
  # the same 20% ceiling implies an 85.0% breakeven - three points of margin.
  #
  # Same number, opposite meaning, because the exits changed underneath it.
  max_spread_cost_vs_credit: 0.20
